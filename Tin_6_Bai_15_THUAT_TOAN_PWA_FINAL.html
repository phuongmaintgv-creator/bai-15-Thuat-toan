<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#17313d;background:#fffdf7;--navy:#12354a;--teal:#087e78;--mint:#d9f2ed;--gold:#ffd166;--coral:#dc6b5d;--line:#cbd9d8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f5f8f4,#fffdf7 55%,#eef8f5);min-height:100vh}
.app{max-width:1260px;margin:auto;padding:16px 22px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:4px 2px 12px}
.lesson{font-size:22px;font-weight:800;color:var(--navy)}.progress{display:flex;gap:7px;flex-wrap:wrap}
.progress span{border-radius:99px;padding:7px 12px;background:#e9efed;color:#61747a;font-size:14px;font-weight:700}.progress .active{background:var(--navy);color:white}
main{flex:1;display:flex;flex-direction:column}.screen{display:none;flex:1}.screen.active{display:flex;flex-direction:column}
.intro{align-items:center;justify-content:center;text-align:center;padding:20px 8px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2vw,26px);box-shadow:0 10px 28px #12354a16}
.eyebrow{color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.04em}h1{font-size:clamp(34px,5vw,58px);line-height:1.08;color:var(--navy);margin:10px}h2{font-size:clamp(25px,3.3vw,38px);line-height:1.15;color:var(--navy);margin:8px 0 14px}h3{font-size:20px;color:var(--navy);margin:0 0 10px}
p{line-height:1.45}.lead{font-size:clamp(19px,2vw,26px);color:#35535e;max-width:750px}.question{font-size:clamp(20px,2.2vw,28px);font-weight:700;line-height:1.35;color:var(--navy)}
.paper{width:min(34vw,260px);min-width:190px;margin:8px auto}.paper svg{width:100%;height:auto;display:block}
.btn{border:0;border-radius:12px;padding:13px 21px;min-height:49px;background:var(--teal);color:white;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #05645f}
.btn.secondary{background:var(--navy);box-shadow:0 4px 0 #0b2635}.btn.outline{background:white;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.btn:focus-visible,button:focus-visible{outline:4px solid #087e7844;outline-offset:2px}
.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.instructions{font-size:clamp(18px,2vw,24px);max-width:850px;margin:12px auto 18px}.choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px}
.choice{min-width:145px;min-height:58px;background:white;border:3px solid var(--line);border-radius:14px;color:var(--navy);font-size:22px;font-weight:800;cursor:pointer}.choice.selected{background:var(--mint);border-color:var(--teal)}
.head{margin:18px 0 12px}.head p{margin:6px 0}
.layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr) minmax(240px,1fr);gap:14px;flex:1;align-items:stretch}
.column{min-width:0}.cards,.ordered{display:flex;flex-direction:column;gap:8px}
.step{background:white;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:clamp(15px,1.3vw,17px);line-height:1.32;color:#17313d;cursor:pointer}
.step:hover{border-color:var(--teal)}.step.next{background:#fff9e7;border-color:var(--gold)}.step:disabled{opacity:.48;cursor:default}
.num{display:inline-grid;place-items:center;background:var(--navy);color:white;font-weight:800;border-radius:50%;width:28px;height:28px;margin-right:7px;vertical-align:middle}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#fff,#f4faf7);min-height:330px}
.center .paper{width:min(25vw,215px);min-width:175px}.stage-label{font-weight:800;color:var(--teal);font-size:17px}
.ordered div{display:flex;gap:8px;background:#f1f6f4;border:1px solid #dce8e4;border-radius:10px;padding:8px;font-size:14px;line-height:1.3}
.order-num{font-weight:800;color:var(--teal);min-width:20px}
.feedback{padding:11px 13px;margin-top:10px;border:1px solid var(--line);border-radius:11px;background:#f5f8f7;line-height:1.4;min-height:46px}
.feedback.good{background:var(--mint);border-color:#8ccfc1}.feedback.warn{background:#fff6dc;border-color:#f0d37b}.feedback.error{background:#fff0ed;border-color:#efb6ae}
.sequence{display:grid;grid-template-columns:1fr minmax(35px,.25fr) 1fr;gap:12px;align-items:center}.seq-list{display:grid;gap:7px}.seq-list div{padding:10px;border:1px solid var(--line);border-radius:10px;background:white;line-height:1.3}.seq-list .swapped{border-color:var(--coral);background:#fff0ed}.arrow{text-align:center;color:var(--teal);font-size:35px;font-weight:900}
.targetrow,.answerrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.target{padding:14px;border:2px dashed #94aaa9;border-radius:13px;background:#fbfdfb;min-height:78px;color:var(--navy);font-size:18px;font-weight:800;cursor:pointer}
.target.active,.target.filled{border-style:solid;border-color:var(--teal);background:var(--mint)}
.answer{padding:13px;border:2px solid var(--line);border-radius:12px;background:white;color:var(--navy);font-size:18px;font-weight:800;cursor:pointer}.answer.selected{border-color:var(--gold);background:#fff8df}
.finish{max-width:850px;margin:auto;text-align:center}.conclusion{max-width:760px;text-align:left;margin:12px auto;background:#eef8f5;border-left:6px solid var(--teal);border-radius:9px;padding:15px;font-size:clamp(18px,2vw,22px);line-height:1.45}.explain{font-size:clamp(18px,2vw,23px);font-weight:700;color:var(--navy)}
@media(max-width:900px){.app{padding:12px}.layout{grid-template-columns:1fr 1fr}.center{grid-column:1/-1;grid-row:1;min-height:260px}.center .paper{width:190px}.steparea{grid-column:1}.orderarea{grid-column:2}}
@media(max-width:620px){header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.center,.steparea,.orderarea{grid-column:1;grid-row:auto}.sequence{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.targetrow,.answerrow{grid-template-columns:1fr}.paper{width:220px}.app{padding:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.step,.choice,.target,.answer{min-height:48px}

<script>
"use strict";
// Giáo viên có thể chỉnh các bước và phản hồi tại khu vực dữ liệu này.
const steps=[
"Gấp hai đường chéo của tờ giấy hình vuông để tạo nếp gấp, mở tờ giấy ra.",
"Gấp bốn góc của tờ giấy vào tâm.",
"Lật mặt bên kia.",
"Tiếp tục gấp bốn góc vào tâm.",
"Đặt tờ giấy đã gấp nằm ngang, luồn ngón cái và ngón trỏ của hai tay vào bốn góc ở mặt dưới.",
"Chỉnh sửa các nếp gấp."
];
const S={screen:"intro",prediction:null,chosen:[],errors:{},feedback:"",kind:"",swapped:false,ran:false,target:null,answers:{input:"",output:""},review:"",reviewGood:false};
const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function paperSvg(stage,warning){
 let d="";
 if(stage===0)d='<rect x="35" y="35" width="210" height="210" fill="#fffdf7" stroke="#12354a" stroke-width="4"/><path d="M35 35L245 245M245 35L35 245" stroke="#d6a844" stroke-width="3" stroke-dasharray="8 7"/><text x="140" y="275" text-anchor="middle" font-size="15" fill="#12354a">Tờ giấy hình vuông</text>';
 else if(stage===1)d='<rect x="35" y="35" width="210" height="210" fill="#fffdf7" stroke="#12354a" stroke-width="4"/><path d="M35 35L245 245M245 35L35 245" stroke="#d6a844" stroke-width="4"/><circle cx="140" cy="140" r="6" fill="#087e78"/><text x="140" y="275" text-anchor="middle" font-size="15" fill="#12354a">Nếp gấp đã tạo</text>';
 else if(stage===2)d='<rect x="35" y="35" width="210" height="210" fill="#fffdf7" stroke="#12354a" stroke-width="4"/><path d="M35 35L140 140L245 35M245 35L140 140L245 245M245 245L140 140L35 245M35 245L140 140L35 35" fill="#d9f2ed" stroke="#087e78" stroke-width="3"/><circle cx="140" cy="140" r="5" fill="#12354a"/>';
 else if(stage===3)d='<rect x="35" y="35" width="210" height="210" fill="#d9f2ed" stroke="#12354a" stroke-width="4"/><path d="M35 35L140 140L245 35M245 35L140 140L245 245M245 245L140 140L35 245M35 245L140 140L35 35" fill="#b8e5dc" stroke="#087e78" stroke-width="3"/><path d="M80 45Q140 10 200 45" fill="none" stroke="#dc6b5d" stroke-width="4"/><text x="140" y="275" text-anchor="middle" font-size="15" fill="#12354a">Đã lật sang mặt bên kia</text>';
 else if(stage===4)d='<rect x="35" y="35" width="210" height="210" fill="#d9f2ed" stroke="#12354a" stroke-width="4"/><path d="M35 35L140 140L245 35M245 35L140 140L245 245M245 245L140 140L35 245M35 245L140 140L35 35" fill="#fffdf7" stroke="#087e78" stroke-width="3"/><path d="M84 84L140 140L196 84L196 196L140 140L84 196Z" fill="#f7e7ad" stroke="#d6a844" stroke-width="3"/>';
 else if(stage===5)d='<rect x="35" y="35" width="210" height="210" fill="#d9f2ed" stroke="#12354a" stroke-width="4"/><path d="M35 35L140 140L245 35M245 35L140 140L245 245M245 245L140 140L35 245M35 245L140 140L35 35" fill="#fffdf7" stroke="#087e78" stroke-width="3"/><path d="M55 55L140 140L140 80L85 55ZM225 55L140 140L200 140L225 85ZM225 225L140 140L140 200L195 225ZM55 225L140 140L80 140L55 195Z" fill="#f7e7ad" stroke="#d6a844" stroke-width="3"/>';
 else d='<rect x="35" y="35" width="210" height="210" rx="5" fill="#d9f2ed" stroke="#12354a" stroke-width="4"/><path d="M35 35L140 140L245 35M245 35L140 140L245 245M245 245L140 140L35 245M35 245L140 140L35 35" fill="#fffdf7" stroke="#087e78" stroke-width="3"/><path d="M60 60L140 140L140 82L82 60ZM220 60L140 140L198 140L220 82ZM220 220L140 140L140 198L198 220ZM60 220L140 140L82 140L60 198Z" fill="#ffd166" stroke="#d6a844" stroke-width="3"/><text x="140" y="275" text-anchor="middle" font-size="15" fill="#12354a">Hình trò chơi hoàn chỉnh</text>';
 const over=warning?'<rect x="29" y="29" width="222" height="222" rx="10" fill="none" stroke="#dc6b5d" stroke-width="7" stroke-dasharray="10 7"/>':"";
 return '<svg viewBox="0 0 280 300" role="img" aria-label="Minh họa tờ giấy sau bước gấp"><rect x="12" y="12" width="256" height="276" rx="18" fill="'+(warning?"#fff0ed":"#f7e7ad")+'"/>'+d+over+'</svg>';
}
function btn(label,action,cls,disabled){return '<button class="btn '+(cls||"")+'" data-action="'+action+'" '+(disabled?"disabled":"")+'>'+esc(label)+'</button>'}
function box(text,kind){return '<div class="feedback '+(kind||"")+'" role="status">'+esc(text)+'</div>'}
function progress(){
 document.querySelectorAll("[data-progress]").forEach(function(x){x.classList.remove("active")});
 const m={predict:"predict",steps:"challenge",experiment:"challenge",review:"review"}[S.screen];
 if(m){const el=document.querySelector('[data-progress="'+m+'"]');if(el)el.classList.add("active")}
}
function render(){
 progress();
 if(S.screen==="intro"){
 app.innerHTML='<section class="screen active intro"><div class="eyebrow">Tin học lớp 6</div><h1>Thử thách gấp<br>đúng trình tự</h1><div class="paper">'+paperSvg(0,false)+'</div><p class="lead">Giúp bạn nhỏ gấp hình trò chơi Đông–Tây–Nam–Bắc nhé!</p>'+btn("Bắt đầu","start")+'</section>';
 }else if(S.screen==="guide"){
 app.innerHTML='<section class="screen active intro"><div class="panel"><div class="eyebrow">Hướng dẫn</div><h2>Quan sát và thử nhé!</h2><p class="instructions">Chọn lần lượt các bước để gấp hình. Quan sát tờ giấy sau mỗi bước.</p><p class="instructions">Sau đó, thử đổi thứ tự bước 3 và bước 4.</p>'+btn("Vào thử thách","predict","secondary")+'</div></section>';
 }else if(S.screen==="predict"){
 app.innerHTML='<section class="screen active intro"><div class="panel"><div class="eyebrow">Dự đoán</div><p class="question">Nếu đổi thứ tự bước “Lật mặt bên kia” và bước “Tiếp tục gấp bốn góc vào tâm”, hình có gấp được như hướng dẫn không?</p><div class="choices"><button class="choice '+(S.prediction==="Có"?"selected":"")+'" data-predict="Có">Có</button><button class="choice '+(S.prediction==="Không"?"selected":"")+'" data-predict="Không">Không</button></div>'+(S.feedback?box(S.feedback,"good"):"")+'<div class="actions">'+btn("Kiểm tra dự đoán","confirm","secondary")+'</div></div></section>';
 }else if(S.screen==="steps"){
 const stage=S.chosen.length;
 let cards="",ordered="";
 const labels=["A","B","C","D","E","F"];
 steps.forEach(function(s,i){cards+='<button class="step '+(i===stage?"next":"")+'" data-step="'+i+'" '+(S.chosen.includes(i)?"disabled":"")+'><span class="num">'+labels[i]+'</span>'+esc(s)+'</button>'});
 if(!stage)ordered='<div class="feedback">Chưa chọn bước nào.</div>';
 S.chosen.forEach(function(i,pos){ordered+='<div><span class="order-num">'+(pos+1)+'.</span><span>'+esc(steps[i])+'</span></div>'});
 app.innerHTML='<section class="screen active"><div class="head"><h2>Chọn bước tiếp theo</h2></div><div class="layout"><div class="panel column steparea"><h3>Các bước gấp</h3><div class="cards">'+cards+'</div></div><div class="panel center"><div class="stage-label">'+(stage===6?"Đầu ra: Hình trò chơi Đông–Tây–Nam–Bắc":"Đầu vào: Tờ giấy hình vuông")+'</div><div class="paper">'+paperSvg(stage,false)+'</div><div class="stage-label">Bước '+stage+' / 6</div></div><div class="panel column orderarea"><h3>Thứ tự đã chọn</h3><div class="ordered">'+ordered+'</div>'+(S.feedback?box(S.feedback,S.kind):box("Chọn bước đúng tiếp theo để tiếp tục."))+'<div class="actions">'+btn("Bỏ chọn bước cuối","undo","outline",!stage)+'</div></div></div><div class="actions">'+btn("Tiếp tục","experiment","secondary",stage!==6)+'</div></section>';
 }else if(S.screen==="experiment"){
 let orig="",changed="";const order=S.swapped?[0,1,3,2,4,5]:[0,1,2,3,4,5];
 steps.forEach(function(s,i){orig+='<div><b>'+(i+1)+'.</b> '+esc(s)+'</div>'});
 order.forEach(function(idx,pos){changed+='<div class="'+(S.swapped&&(idx===2||idx===3)?"swapped":"")+'"><b>'+(pos+1)+'.</b> '+esc(steps[idx])+'</div>'});
 const result=S.ran?'<div class="targetrow"><div class="panel center">'+paperSvg(3,true)+'</div>'+box("Thứ tự mới không theo hướng dẫn. Mặt giấy cần được lật trước khi gấp tiếp ở mặt còn lại.","error")+'</div>':box("Chọn nút để hoán đổi bước 3 và bước 4, rồi chạy thử.");
 app.innerHTML='<section class="screen active"><div class="head"><h2>Thử đổi bước 3 và bước 4</h2><p class="question">Em dự đoán điều gì sẽ xảy ra khi đổi hai bước này?</p></div><div class="panel"><div class="sequence"><div class="seq-list">'+orig+'</div><div class="arrow" aria-hidden="true">→</div><div class="seq-list">'+changed+'</div></div>'+result+'<div class="actions">'+btn("Đổi bước 3 và 4 để thử","swap","secondary")+' '+btn("Chạy thử","run","",!S.swapped)+'</div></div><div class="actions">'+btn("Sắp xếp lại","review","outline")+'</div></section>';
 }else if(S.screen==="review"){
 const input=S.answers.input||"Chọn thẻ đầu vào",output=S.answers.output||"Chọn thẻ đầu ra";
 app.innerHTML='<section class="screen active intro"><div class="panel"><div class="eyebrow">Củng cố</div><h2>Củng cố: Tính tổng hai số</h2><p class="question">Thuật toán nhận hai số a, b và cho kết quả là tổng của chúng. Đâu là đầu vào? Đâu là đầu ra?</p><div class="targetrow"><button class="target '+(S.target==="input"?"active ":"")+(S.answers.input?"filled":"")+'" data-target="input"><span>Đầu vào</span><br>'+esc(input)+'</button><button class="target '+(S.target==="output"?"active ":"")+(S.answers.output?"filled":"")+'" data-target="output"><span>Đầu ra</span><br>'+esc(output)+'</button></div><div class="answerrow"><button class="answer '+(S.selectedCard==="Hai số a, b"?"selected":"")+'" data-card="Hai số a, b">Hai số a, b</button><button class="answer '+(S.selectedCard==="Tổng a + b"?"selected":"")+'" data-card="Tổng a + b">Tổng a + b</button></div>'+(S.review?box(S.review,S.reviewGood?"good":"warn"):box("Chọn một nhãn, rồi chọn thẻ tương ứng."))+'<div class="actions">'+btn("Kiểm tra","check","secondary")+'</div></div></section>';
 }else if(S.screen==="complete"){
 app.innerHTML='<section class="screen active intro"><div class="panel finish"><div class="eyebrow">Hoàn thành</div><h2>Em đã hoàn thành thử thách!</h2><div class="paper">'+paperSvg(6,false)+'</div><div class="conclusion">Thuật toán là một dãy chỉ dẫn rõ ràng, có trình tự để giải quyết một nhiệm vụ.<br><br>Trong thử thách này: đầu vào là tờ giấy hình vuông; đầu ra là hình trò chơi hoàn chỉnh.</div><p class="explain">Hãy giải thích: Vì sao cần làm các bước theo trình tự?</p>'+btn("Làm lại","reset")+'</div></section>';
 }
 bind();
}
function bind(){
 app.querySelectorAll("[data-action]").forEach(function(el){el.addEventListener("click",function(){act(el.dataset.action)})});
 app.querySelectorAll("[data-predict]").forEach(function(el){el.addEventListener("click",function(){S.prediction=el.dataset.predict;S.feedback="";render()})});
 app.querySelectorAll("[data-step]").forEach(function(el){el.addEventListener("click",function(){chooseStep(Number(el.dataset.step))})});
 app.querySelectorAll("[data-target]").forEach(function(el){el.addEventListener("click",function(){S.target=el.dataset.target;render()})});
 app.querySelectorAll("[data-card]").forEach(function(el){el.addEventListener("click",function(){chooseCard(el.dataset.card)})});
}
function chooseStep(i){
 const expected=S.chosen.length;
 if(i===expected){S.chosen.push(i);S.feedback="Đúng trình tự! Hãy quan sát tờ giấy sau bước này.";S.kind="good"}
 else{
   S.errors[expected]=(S.errors[expected]||0)+1;
   if(expected===2||expected===3)S.feedback="Em hãy xem lại bước ngay trước đó. Bước ‘Lật mặt bên kia’ cần diễn ra trước khi gấp tiếp ở mặt còn lại.";
   else if(expected===0)S.feedback="Em hãy xem lại thứ tự các bước rồi thử lại.";
   else S.feedback="Em hãy xem lại thứ tự các bước rồi thử lại.";
   S.kind="warn";
   if(S.errors[expected]>=2&&(expected===2||expected===3))S.feedback+=" Gợi ý: Sau khi gấp bốn góc lần đầu, em cần lật mặt giấy.";
 }
 render();
}
function chooseCard(card){
 if(!S.target){S.review="Hãy chọn nhãn “Đầu vào” hoặc “Đầu ra” trước.";S.reviewGood=false;render();return}
 S.answers[S.target]=card;S.target=null;S.review="";render();
}
function act(a){
 if(a==="start")S.screen="guide";
 else if(a==="predict")S.screen="predict";
 else if(a==="confirm"){if(!S.prediction){S.feedback="Hãy chọn “Có” hoặc “Không” trước nhé.";render();return}S.feedback="Đã ghi nhận dự đoán của lớp. Hãy cùng thử nhé!";S.screen="steps"}
 else if(a==="undo"){if(S.chosen.length){S.chosen.pop();S.feedback="Đã bỏ bước cuối. Em hãy chọn lại bước tiếp theo.";S.kind="warn"}}
 else if(a==="experiment"){if(S.chosen.length!==6){S.feedback="Em hãy hoàn thành đủ sáu bước trước nhé.";S.kind="warn";render();return}S.screen="experiment";S.feedback=""}
 else if(a==="swap"){S.swapped=true;S.ran=false}
 else if(a==="run"){if(S.swapped)S.ran=true}
 else if(a==="review"){S.screen="review";S.review="";S.reviewGood=false;S.target=null}
 else if(a==="check"){
   if(!S.answers.input||!S.answers.output){S.review="Em hãy ghép đủ hai thẻ trước nhé.";S.reviewGood=false}
   else if(S.answers.input==="Hai số a, b"&&S.answers.output==="Tổng a + b"){S.review="Chính xác! Hai số a, b là đầu vào; tổng a + b là đầu ra.";S.reviewGood=true;S.screen="complete"}
   else{S.review="Hãy phân biệt dữ liệu có trước khi thực hiện với kết quả nhận được sau khi thực hiện.";S.reviewGood=false}
 }
 else if(a==="reset"){S.screen="intro";S.prediction=null;S.chosen=[];S.errors={};S.feedback="";S.kind="";S.swapped=false;S.ran=false;S.target=null;S.answers={input:"",output:""};S.review="";S.reviewGood=false}
 render();
}
render();
</script>
